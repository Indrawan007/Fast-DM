[package]
name = "fast-dm"
version = "2.2.2"
edition = "2021"
authors = ["FastDM Contributors"]
description = "High-speed download manager with browser integration"
license = "MIT"

[[bin]]
name = "fast-dm"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# GTK4 GUI
gtk4 = { version = "0.9", features = ["v4_12"] }
glib = "0.20"
gio = "0.20"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP (untuk HEAD request resolve filename)
reqwest = { version = "0.12", features = [
    "rustls-tls",
    "cookies",
    "gzip",
    "brotli",
] }

# URL parsing
url = "2"

# Regex
regex = "1"

# File paths
dirs = "5"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Process management
nix = { version = "0.29", features = ["signal", "process", "user", "fs"] }

# Misc
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
urlencoding = "2.1.3"

[profile.release]
opt-level = 3     # Max optimization
lto = true        # Link-time optimization
codegen-units = 1 # Single codegen unit (slower build, faster binary)
strip = true      # Strip symbols
panic = "abort"   # Smaller binary
