# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libgtk-4-dev \
            dpkg-dev \
            zip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Tag rilis harus melewati gerbang yang sama dengan CI utama. Dulu tag
      # bisa memublikasikan artefak walau audit/deny/clippy di CI merah.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo deny
        run: cargo deny check advisories bans licenses sources

      - name: Clippy (blocking)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Verify .deb ownership
        run: |
          DEB=$(find build -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb --fsys-tarfile "$DEB" \
            | tar --numeric-owner -tvf - \
            | awk '$2 != "0/0" { print "non-root owner: " $0; bad=1 } END { exit bad }'

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install extension tooling
        run: npm ci

      - name: Test browser extension & release hygiene
        run: node --test tests/*.test.cjs

      - name: Lint Chromium extension
        run: node tests/extension_lint.cjs

      - name: Check for undeclared identifiers
        run: node tools/check-undeclared.cjs

      - name: Build extension zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd extension
          zip -r "../build/fast-dm-extension-v${VERSION}.zip" . \
            -x "*.DS_Store" \
            -x "*/.git/*"

      - name: Generate checksums
        run: |
          sha256sum build/*.deb build/*.zip > build/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/*.deb \
            build/*.zip \
            build/SHA256SUMS \
            --generate-notes

  # Paket Arch dibangun di container Arch (makepkg tidak ada di ubuntu-latest)
  # lalu di-upload ke release yang baru saja dibuat job di atas.
  arch-release:
    name: Build and publish Arch package
    runs-on: ubuntu-latest
    needs: release
    container:
      image: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            rust \
            gtk4 \
            aria2 \
            yt-dlp \
            ffmpeg \
            xdg-utils \
            nodejs \
            git \
            sudo \
            github-cli

      - uses: actions/checkout@v5

      - name: Run tests
        run: cargo test --locked

      - name: Test browser extension & release hygiene
        run: node --test tests/*.test.cjs

      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "bash packaging/build-arch.sh"

      - name: Generate checksums
        run: sha256sum build/*.pkg.tar.zst > build/SHA256SUMS-arch

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            build/*.pkg.tar.zst \
            build/SHA256SUMS-arch
