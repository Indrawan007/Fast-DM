# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Arch + Hyprland release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # Build, test, and package only in the supported Arch environment.
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            rust \
            gtk4 \
            aria2 \
            yt-dlp \
            ffmpeg \
            xdg-utils \
            wl-clipboard \
            nodejs \
            npm \
            git \
            sudo \
            zip \
            github-cli

      - uses: actions/checkout@v5

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build and smoke-test binary
        run: |
          cargo build --release --locked
          ./target/release/fast-dm --version
          ./target/release/fast-dm --help

      - name: Install extension test dependencies
        run: npm ci

      - name: Test and lint browser extension
        run: |
          node --test tests/*.test.cjs
          node tests/extension_lint.cjs
          node tools/check-undeclared.cjs

      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "bash packaging/build-arch.sh"

      - name: Build browser extension zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd extension
          zip -r "../build/fast-dm-extension-v${VERSION}.zip" . \
            -x "*.DS_Store" \
            -x "*/.git/*"

      - name: Generate checksums
        run: sha256sum build/*.pkg.tar.zst build/*.zip > build/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/*.pkg.tar.zst \
            build/*.zip \
            build/SHA256SUMS \
            --generate-notes
