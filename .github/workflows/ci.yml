name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs untuk branch yang sama (hemat CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: test + build (PR utama) — gabung agar hemat runner minutes
  # ────────────────────────────────────────────────────────────────
  test-and-build:
    name: Test & Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libgtk-4-dev \
            aria2 \
            xvfb  # untuk GUI smoke test (jika ditambah nanti)
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        # Default rust-cache sudah memetakan workspace `.` ke `target`.
        # Menulis `target` sebagai workspace kedua membuat action mencoba cwd
        # yang belum ada dan selalu mencetak error non-fatal.
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        # `cargo fmt --check` mengembalikan non-zero kalau ada diff.
        # Step ini blocking — contributor harus menjalankan rustfmt sebelum merge.

        run: cargo fmt --all -- --check

      - name: Audit Rust dependencies
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

      - name: Check dependency policy
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo deny
        run: cargo deny check advisories bans licenses sources

      - name: Clippy (blocking)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run all tests (unit + integration)
        # Jalankan seluruh unit test dan integration test di tests/.

        # --no-fail-fast: jalankan semua, jangan stop di error pertama.
        # --nocapture: tampilkan println!() di test output untuk debugging.
        # --locked (v3.2.3, C5): job arch/release dan packaging/build-deb.sh
        # sudah memakainya; job utama ini belum, sehingga drift Cargo.lock
        # baru ketahuan di langkah "Build release binary" — setelah seluruh
        # tes selesai. Dengan --locked kegagalannya muncul di langkah pertama.
        run: cargo test --locked --no-fail-fast -- --nocapture

      - name: Build release binary
        run: cargo build --release --locked

      - name: "Smoke test: binary bisa start"
        # Validasi runtime: binary exit code 0 saat start tanpa GUI.
        # --help selalu exit 0, cocok untuk smoke test tanpa GTK display.
        run: |
          ./target/release/fast-dm --version
          ./target/release/fast-dm --help

      - name: Upload release binary
        uses: actions/upload-artifact@v6
        with:
          name: fast-dm-linux-x86_64
          path: target/release/fast-dm
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # Job 2: extension zip (untuk rilis / Chrome Web Store upload manual)
  # ────────────────────────────────────────────────────────────────
  extension:
    name: Zip browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test browser extension & release hygiene
        run: node --test tests/*.test.cjs

      - name: Lint Chromium extension
        run: node tests/extension_lint.cjs

      # v3.2.3 (C4): `node --check` (di extension_lint.cjs) hanya memvalidasi
      # SINTAKS. Regresi v3.2.2 (`videoMenu` dipakai tanpa pernah dideklarasikan,
      # handler async → ReferenceError jadi unhandled rejection → ketiga item
      # context menu mati) lolos dari lint itu dan baru ketahuan dari test.
      # Pemeriksa identifier ber-scope ini menutup kelas bug tersebut secara
      # langsung: identifier yang tidak pernah dideklarasikan = merah.
      - name: Check for undeclared identifiers
        run: |
          npm ci
          node tools/check-undeclared.cjs

      - name: Zip extension
        run: |
          cd extension
          zip -r ../fast-dm-extension.zip . \
            -x "*.DS_Store" \
            -x "*/.git/*"

      - name: Upload extension zip
        uses: actions/upload-artifact@v6
        with:
          name: fast-dm-extension
          path: fast-dm-extension.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # Job 3: .deb package (full release artifact)
  # ────────────────────────────────────────────────────────────────
  deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libgtk-4-dev \
            dpkg-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build .deb
        run: bash packaging/build-deb.sh

      - name: Verify .deb ownership
        run: |
          DEB=$(find build -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb --fsys-tarfile "$DEB" \
            | tar --numeric-owner -tvf - \
            | awk '$2 != "0/0" { print "non-root owner: " $0; bad=1 } END { exit bad }'

      - name: Upload .deb
        uses: actions/upload-artifact@v6
        with:
          name: fast-dm-deb
          path: build/*.deb
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # Job 4: Arch Linux — validasi distro non-Debian + paket pacman
  #
  # Semua job lain jalan di ubuntu-latest, jadi tanpa job ini pesan
  # "sudo apt install …" dan asumsi nama paket Debian tidak pernah
  # teruji. Di sini kode dibangun & dites di atas Arch sungguhan dan
  # packaging/PKGBUILD benar-benar dijalankan lewat makepkg.
  # ────────────────────────────────────────────────────────────────
  arch:
    name: Arch Linux (build, test, .pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # Container Arch kosong: toolchain + dependensi runtime dipasang dulu,
      # SEBELUM checkout (actions/checkout butuh git & node di dalam container).
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            rust \
            gtk4 \
            aria2 \
            yt-dlp \
            ffmpeg \
            xdg-utils \
            libnotify \
            nodejs \
            git \
            sudo

      - uses: actions/checkout@v5

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all tests (unit + integration)
        run: cargo test --locked --no-fail-fast

      - name: Test browser extension & release hygiene
        run: node --test tests/*.test.cjs

      - name: Smoke test binary
        run: |
          cargo build --release --locked
          ./target/release/fast-dm --version
          ./target/release/fast-dm --help

      # makepkg menolak dijalankan sebagai root, sedangkan container CI
      # berjalan sebagai root — jadi build paket dilakukan user biasa.
      - name: Build .pkg.tar.zst via makepkg
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "bash packaging/build-arch.sh"

      - name: Verify package contents
        run: |
          ls -l build/*.pkg.tar.zst
          tar -tf build/*.pkg.tar.zst | grep -E \
            'opt/fast-dm/fast-dm$|opt/fast-dm/fast-dm-native$|usr/bin/fast-dm$|applications/fast-dm\.desktop$|128x128/apps/io\.github\.fastdm\.FastDownloadManager\.png$'

      - name: Upload Arch package
        uses: actions/upload-artifact@v6
        with:
          name: fast-dm-arch-x86_64
          path: build/*.pkg.tar.zst
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # Job 5: CI status badge untuk README
  # ────────────────────────────────────────────────────────────────
  # (GitHub otomatis generate badge via shields.io URL pattern:
  #  https://github.com/${{ github.repository }}/actions/workflows/ci.yml/badge.svg)
