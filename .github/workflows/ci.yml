name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch Linux + Hyprland/Wayland target
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # Runtime, build tools, and packaging are all validated inside Arch.
      # The compositor itself is not started in CI; UI startup is checked by
      # the Wayland environment guard unit test.
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            rust \
            gtk4 \
            aria2 \
            yt-dlp \
            ffmpeg \
            xdg-utils \
            wl-clipboard \
            nodejs \
            npm \
            git \
            sudo \
            zip

      - uses: actions/checkout@v5

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources

      - name: Clippy (blocking)
        id: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Publish Clippy diagnostics as annotations
        if: failure() && steps.clippy.outcome == 'failure'
        run: |
          cargo clean -p fast-dm
          cargo clippy --all-targets --message-format=short -- -D warnings \
            > clippy.log 2>&1 || true
          grep -E '(^|: )(error|warning)(\[|:)' clippy.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Run Rust tests
        run: cargo test --locked --no-fail-fast -- --nocapture

      - name: Build and smoke-test binary
        run: |
          cargo build --release --locked
          ./target/release/fast-dm --version
          ./target/release/fast-dm --help

      - name: Install extension test dependencies
        run: npm ci

      - name: Test and lint browser extension
        run: |
          node --test tests/*.test.cjs
          node tests/extension_lint.cjs
          node tools/check-undeclared.cjs

      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "bash packaging/build-arch.sh"

      - name: Verify package contents
        run: |
          ls -l build/*.pkg.tar.zst
          tar -tf build/*.pkg.tar.zst | grep -E \
            'opt/fast-dm/fast-dm$|opt/fast-dm/fast-dm-native$|usr/bin/fast-dm$|applications/fast-dm\.desktop$|128x128/apps/io\.github\.fastdm\.FastDownloadManager\.png$'

      - name: Build browser extension zip
        run: |
          cd extension
          zip -r ../fast-dm-extension.zip . \
            -x "*.DS_Store" \
            -x "*/.git/*"

      - name: Upload Arch package
        uses: actions/upload-artifact@v6
        with:
          name: fast-dm-arch-x86_64
          path: build/*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload binary and extension
        uses: actions/upload-artifact@v6
        with:
          name: fast-dm-arch-build
          path: |
            target/release/fast-dm
            fast-dm-extension.zip
          if-no-files-found: error
