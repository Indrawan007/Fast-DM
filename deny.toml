# Dependency policy for cargo-deny.
# The project is distributed under MIT and links against the platform GTK
# libraries dynamically; all Rust dependency licenses must remain compatible
# with redistribution of the application.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # webpki-roots >= 1.0 (dipakai reqwest rustls-tls) berlisensi CDLA-Permissive-2.0
    # — lisensi data permisif (bebas redistribusi, tanpa copyleft).
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-only",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
